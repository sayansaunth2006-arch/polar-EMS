# Render.com blueprint for the POLAR-EMS backend.
# Deploy: connect this repo in the Render dashboard and it will detect this
# file automatically ("New +" -> "Blueprint"). A managed Postgres instance
# is provisioned and DATABASE_URL is wired in automatically.
#
# The frontend is intended for Vercel (see the root README's Deployment
# section) rather than Render, since Vercel is the natural fit for a
# Next.js app; this blueprint only covers the API + database.
#
# NOTE: this file alone is not sufficient for a working deploy. It expects
# a `backend/` directory (the FastAPI app, requirements.txt) to exist on
# whatever branch Render builds from. As of this commit, the `main` branch
# does not yet contain that backend code (it currently holds an unrelated
# placeholder Next.js app) — see the POLAR-EMS backend+frontend on the
# `claude/ui-ux-pro-max-skill-install-9j46f2` branch / PR #1.

databases:
  - name: polar-ems-db
    plan: free
    databaseName: polar_ems
    user: polar_ems

services:
  - type: web
    name: polar-ems-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: polar-ems-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://YOUR-FRONTEND-DOMAIN.vercel.app"
      - key: ENVIRONMENT
        value: production
